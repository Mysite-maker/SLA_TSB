name: Daily GLPI Export to CSV

on:
  schedule:
    # เที่ยงคืนของไทย (17:00 UTC ของวันก่อนหน้า)
    - cron: '0 17 * * *'
  workflow_dispatch: # ปุ่มสำหรับกดสั่งรันมือเพื่อทดสอบได้ทันที

jobs:
  export-glpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Export Script
        env:
          GLPI_URL: "https://asset.thaismilebus.com/glpi/apirest.php"
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          TARGET_ENTITY_ID: "15"
          OUTPUT_CSV_NAME: "glpi3.csv"
        run: |
          python glpi_station_github.py

      - name: Commit and Push glpi3.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add glpi3.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update glpi3.csv [skip ci]" && git push)
